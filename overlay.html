<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixelBuddy overlay</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
      #note { position: fixed; left: 8px; bottom: 8px; font: 600 14px system-ui, sans-serif; color: #fff;
        text-shadow: 0 1px 2px #000; display: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="note"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
