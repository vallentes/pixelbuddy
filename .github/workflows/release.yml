name: release

# Builds signed installers for Windows and macOS when a v* tag is pushed.
# Secrets: PIXELBUDDY_TWITCH_CLIENT_ID (optional), WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD,
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      PIXELBUDDY_TWITCH_CLIENT_ID: ${{ secrets.PIXELBUDDY_TWITCH_CLIENT_ID }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace
      - name: Import Windows certificate
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the in-app update files (latest.json points at them).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: bash
        run: |
          # Empty secrets would make the bundler try (and fail) to import a certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Without an Apple certificate, use an ad-hoc signature so the app still runs on Apple Silicon.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then export APPLE_SIGNING_IDENTITY="-"; fi
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: pixelbuddy-${{ matrix.os }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
      - name: Attach installers to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.exe.sig target/release/bundle/msi/*.msi
                 target/universal-apple-darwin/release/bundle/dmg/*.dmg
                 target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "PixelBuddy ${GITHUB_REF_NAME#v}" --notes "See README for install steps."
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # After both platforms are built, publish latest.json for the in-app updater.
  updater-manifest:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sigs
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.sig' -D sigs
          node scripts/updater-manifest.mjs "$GITHUB_REF_NAME" sigs "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" latest.json -R "$GITHUB_REPOSITORY" --clobber
